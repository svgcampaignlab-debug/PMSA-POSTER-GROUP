<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMSA Kalotsav Group Poster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap');
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:#1c2a44;
    font-family:'Poppins',system-ui,sans-serif;
    background:
      radial-gradient(circle at 8% 0%, rgba(255,80,140,.16), transparent 36%),
      radial-gradient(circle at 100% 8%, rgba(40,120,255,.14), transparent 40%),
      #f7f3ea;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 12px 48px;
  }
  .bar{width:100%; max-width:820px; height:6px; border-radius:4px; margin-bottom:12px;
    background:linear-gradient(90deg,#e23b4a,#f5a623 30%,#2f9e44 55%,#1d6fe8 80%,#7a3cff);}
  h1{font-size:18px; font-weight:800; margin:0 0 4px; text-align:center; color:#1a3f8b;}
  p.sub{margin:0 0 12px; text-align:center; color:#5c6b84; font-size:13px;}
  .stage{width:100%; max-width:860px; border-radius:16px; overflow:hidden;
    box-shadow:0 16px 36px rgba(20,30,60,.2); background:#fff;}
  .stage canvas{display:block; width:100%; height:auto;}
  .cards{width:100%; max-width:860px; margin-top:14px; display:flex; flex-direction:column; gap:12px;}
  .card{background:#fff; border-radius:16px; padding:14px 16px; border:1px solid #eadfce;
    box-shadow:0 8px 18px rgba(20,30,60,.06); position:relative; overflow:hidden;}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,#e23b4a,#1d6fe8);}
  .card-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .num{width:24px; height:24px; border-radius:50%; color:#fff; font-size:12px; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .n1{background:#e23b4a}.n2{background:#1d6fe8}.n3{background:#2f9e44}.n4{background:#f5a623}.n5{background:#7a3cff}.n0{background:#1a3f8b}
  .ttl{font-size:14.5px; font-weight:800; color:#1a3f8b;}
  label{display:block; font-size:12px; color:#5c6b84; font-weight:700; margin-bottom:6px;}
  input[type="text"], select{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid #eadfce; background:#fffdf8;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:15px; outline:none; color:#1c2a44;
  }
  input:focus, select:focus{border-color:#1d6fe8;}
  .btn{width:100%; padding:12px; border:none; border-radius:10px; font-weight:800; cursor:pointer; font-family:'Poppins',sans-serif;}
  .btn-photo{background:linear-gradient(135deg,#1a3f8b,#1d6fe8); color:#fff;}
  .btn-recrop{background:#eef4ff; color:#1a3f8b; border:1.5px solid #c9daf8; margin-top:8px;}
  .btn-reset{background:#fff; color:#8a3a3a; border:1.5px solid #f0c7c7; margin-top:8px;}
  .btn-recrop:disabled,.btn-reset:disabled{opacity:.4; cursor:not-allowed;}
  .photo-row{display:flex; gap:10px; align-items:center;}
  .thumb{width:120px; height:54px; border-radius:10px; border:2px dashed #d5c7ae; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:#f7f1e6; flex-shrink:0;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .hint{font-size:11.5px; color:#6d7890; margin-top:8px; line-height:1.45;}
  .btn-download{background:linear-gradient(135deg,#1a3f8b,#0d2148); color:#fff; font-size:15.5px; padding:15px;}
  #filePhoto{display:none;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,16,32,.84); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal-card{background:#fff; border-radius:18px; padding:20px; width:100%; max-width:640px; text-align:center;}
  .modal-card h2{margin:0 0 6px; color:#1a3f8b; font-size:16px;}
  .crop-wrap{margin:0 auto 12px; border-radius:12px; overflow:hidden; background:#eceff4; touch-action:none; cursor:grab; max-width:100%;}
  .crop-wrap canvas{display:block; width:100%; height:auto;}
  .zoom-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .zoom-row input{flex:1; accent-color:#1d6fe8;}
  .modal-actions{display:flex; gap:10px;}
  .btn-cancel{background:#f4eee6; color:#5a4630;}
</style>
</head>
<body>
  <div class="bar"></div>
  <h1>PMSA Arts Fest Kalotsav — Group</h1>
  <p class="sub">ഗ്രൂപ്പ് ഫോട്ടോയും വിവരങ്ങളും ചേർത്ത് പോസ്റ്റർ തയ്യാറാക്കൂ</p>
  <div class="stage"><canvas id="posterCanvas" width="3200" height="1800"></canvas></div>
  <div class="cards">
    <div class="card">
      <div class="card-head"><span class="num n0">1</span><span class="ttl">Group Photo</span></div>
      <div class="photo-row">
        <div class="thumb" id="photoThumb">📷</div>
        <div style="flex:1">
          <button class="btn btn-photo" id="pickPhotoBtn">ഫോട്ടോ അപ്‌ലോഡ് ചെയ്യുക</button>
          <button class="btn btn-recrop" id="recropPhotoBtn" disabled>✂️ ക്രോപ്പ് ക്രമീകരിക്കുക</button>
          <button class="btn btn-reset" id="resetPhotoBtn" disabled>↺ റീസെറ്റ്</button>
        </div>
      </div>
      <p class="hint">ഫ്രെയിമിന്റെ നാല് ബോർഡറും നിറയും. ഗ്രൂപ്പ് ഫോട്ടോയ്ക്ക് അനുയോജ്യം.</p>
    </div>
    <div class="card">
      <div class="card-head"><span class="num n1">2</span><span class="ttl">Name</span></div>
      <label for="nameInput">English only · GROUP NAME</label>
      <input type="text" id="nameInput" maxlength="42" placeholder="GROUP NAME" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-head"><span class="num n2">3</span><span class="ttl">Class</span></div>
      <label for="classInput">English and numbers · SECTION</label>
      <input type="text" id="classInput" maxlength="24" placeholder="10 A" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-head"><span class="num n3">4</span><span class="ttl">Category</span></div>
      <label for="catInput">English only · SECTION</label>
      <input type="text" id="catInput" maxlength="28" placeholder="HS GENERAL" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-head"><span class="num n4">5</span><span class="ttl">Item</span></div>
      <label for="itemInput">English only · GROUP NAME</label>
      <input type="text" id="itemInput" maxlength="36" placeholder="GROUP SONG" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-head"><span class="num n5">6</span><span class="ttl">Position</span></div>
      <label for="posInput">Select · POSITION</label>
      <select id="posInput">
        <option value="">— Select Position —</option>
        <option>First</option>
        <option>Second</option>
        <option>Third</option>
      </select>
    </div>
    <button class="btn btn-download" id="downloadBtn">⬇ പോസ്റ്റർ ഡൗൺലോഡ് ചെയ്യുക</button>
    <input type="file" id="filePhoto" accept="image/*">
  </div>

  <div class="modal-backdrop" id="cropModal">
    <div class="modal-card">
      <h2>ഫോട്ടോ ക്രോപ്പ് ചെയ്യുക</h2>
      <p style="color:#5c6b84;font-size:12px;margin:0 0 12px">വലിച്ചു നീക്കാം, സൂം ചെയ്യാം. നാല് വശവും നിറയും.</p>
      <div class="crop-wrap" id="cropWrap"><canvas id="cropCanvas"></canvas></div>
      <div class="zoom-row"><span>➖</span><input type="range" id="zoomRange" min="100" max="350" value="100"><span>➕</span></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cropCancelBtn">റദ്ദാക്കുക</button>
        <button class="btn btn-photo" id="cropConfirmBtn">✔ ശരി</button>
      </div>
    </div>
  </div>

  function fitText(c, text, maxW, start){
    let s = start;
    c.font = '700 '+s+'px Poppins,sans-serif';
    while(c.measureText(text).width > maxW && s > 14){
      s -= 1; c.font = '700 '+s+'px Poppins,sans-serif';
    }
    return s;
  }
  function drawLine(text, y){
    if(!text) return;
    fitText(ctx, text, BOX.maxW, BOX.size);
    ctx.fillText(text, BOX.x, y);
  }
  function draw(){
    ctx.clearRect(0,0,CW,CH);
    if(templateImg.complete && templateImg.naturalWidth)
      ctx.drawImage(templateImg, 0, 0, CW, CH);
    else { ctx.fillStyle='#f4efe6'; ctx.fillRect(0,0,CW,CH); }

    if(photoPlacement){
      ctx.save();
      roundRectPath(ctx, PHOTO.cx-PHOTO.w/2, PHOTO.cy-PHOTO.h/2, PHOTO.w, PHOTO.h, PHOTO.radius);
      ctx.clip();
      ctx.drawImage(
        photoPlacement.img,
        PHOTO.cx+photoPlacement.x - photoPlacement.w*0.03,
        PHOTO.cy+photoPlacement.y - photoPlacement.h*0.03,
        photoPlacement.w*1.06,
        photoPlacement.h*1.06
      );
      ctx.restore();
      ctx.save();
      roundRectPath(ctx, PHOTO.cx-PHOTO.w/2, PHOTO.cy-PHOTO.h/2, PHOTO.w, PHOTO.h, PHOTO.radius);
      ctx.strokeStyle = '#e8c15a';
      ctx.lineWidth = 16*S;
      ctx.stroke();
      ctx.strokeStyle = '#b8860b';
      ctx.lineWidth = 4*S;
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.fillStyle = '#1a2744';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const name = [val('nameInput'), val('itemInput')].filter(Boolean).join('  ·  ');
    const section = [val('classInput'), val('catInput')].filter(Boolean).join('  ·  ');
    drawLine(name, LINES.name);
    drawLine(section, LINES.section);
    drawLine(val('posInput'), LINES.position);
    ctx.restore();
  }

  templateImg.onload = () => {
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    draw();
  };

  function engOnly(id, allowNum){
    document.getElementById(id).addEventListener('input', e => {
      const el=e.target, caret=el.selectionStart;
      const re = allowNum ? /[^A-Za-z0-9 .'\-\/]/g : /[^A-Za-z .'\-]/g;
      el.value = el.value.replace(re,'').toUpperCase();
      try{ el.setSelectionRange(caret,caret); }catch(err){}
      draw();
    });
  }
  engOnly('nameInput', false);
  engOnly('classInput', true);
  engOnly('catInput', false);
  engOnly('itemInput', false);
  document.getElementById('posInput').addEventListener('change', draw);

  const cropModal=document.getElementById('cropModal');
  const cropCanvas=document.getElementById('cropCanvas');
  const cropCtx=cropCanvas.getContext('2d');
  const cropWrap=document.getElementById('cropWrap');
  const zoomRange=document.getElementById('zoomRange');
  let pendingImg=null, baseScale=1, zoom=1, panX=0, panY=0;
  let dragging=false, dsx=0, dsy=0, psx=0, psy=0;
  let PW=560, PH=230;

  function cur(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    return {x:PW/2-w/2+panX, y:PH/2-h/2+panY, w, h};
  }
  function clamp(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    const mx=Math.max(0,(w-PW)/2), my=Math.max(0,(h-PH)/2);
    panX=Math.min(mx,Math.max(-mx,panX)); panY=Math.min(my,Math.max(-my,panY));
  }
  function drawCrop(){
    cropCtx.clearRect(0,0,PW,PH);
    cropCtx.save();
    roundRectPath(cropCtx,0,0,PW,PH, 10);
    cropCtx.clip();
    cropCtx.fillStyle='#eceff4'; cropCtx.fillRect(0,0,PW,PH);
    if(pendingImg){ const d=cur(); cropCtx.drawImage(pendingImg,d.x,d.y,d.w,d.h); }
    cropCtx.restore();
  }
  function openCrop(img){
    pendingImg=img;
    PW=560; PH=Math.round(560*(PHOTO.h/PHOTO.w));
    cropCanvas.width=PW; cropCanvas.height=PH;
    cropWrap.style.width='100%'; cropWrap.style.maxWidth=PW+'px';
    baseScale=Math.max(PW/img.width, PH/img.height);
    zoom=1; panX=0; panY=0; zoomRange.value=100;
    drawCrop(); cropModal.classList.add('open');
  }
  cropWrap.addEventListener('pointerdown', e => {
    if(!pendingImg) return;
    dragging=true; cropWrap.setPointerCapture(e.pointerId);
    dsx=e.clientX; dsy=e.clientY; psx=panX; psy=panY;
  });
  cropWrap.addEventListener('pointermove', e => {
    if(!dragging) return;
    const rect=cropCanvas.getBoundingClientRect();
    const sx=PW/rect.width, sy=PH/rect.height;
    panX=psx+(e.clientX-dsx)*sx; panY=psy+(e.clientY-dsy)*sy; clamp(); drawCrop();
  });
  cropWrap.addEventListener('pointerup', ()=>dragging=false);
  cropWrap.addEventListener('pointercancel', ()=>dragging=false);
  zoomRange.addEventListener('input', ()=>{ zoom=parseInt(zoomRange.value,10)/100; clamp(); drawCrop(); });
  document.getElementById('cropCancelBtn').onclick=()=>cropModal.classList.remove('open');
  document.getElementById('cropConfirmBtn').onclick=()=>{
    const d=cur(); const mapX=PHOTO.w/PW, mapY=PHOTO.h/PH;
    photoPlacement={ img:pendingImg, x:(d.x-PW/2)*mapX, y:(d.y-PH/2)*mapY, w:d.w*mapX, h:d.h*mapY };
    document.getElementById('recropPhotoBtn').disabled=false;
    document.getElementById('resetPhotoBtn').disabled=false;
    const thumb=document.getElementById('photoThumb'); thumb.innerHTML='';
    const im=document.createElement('img'); im.src=pendingImg.src; thumb.appendChild(im);
    cropModal.classList.remove('open'); draw();
  };

  const filePhoto=document.getElementById('filePhoto');
  document.getElementById('pickPhotoBtn').onclick=()=>filePhoto.click();
  filePhoto.addEventListener('change', e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{ const img=new Image(); img.onload=()=>openCrop(img); img.src=ev.target.result; };
    r.readAsDataURL(file); filePhoto.value='';
  });
  document.getElementById('recropPhotoBtn').onclick=()=>{ if(photoPlacement) openCrop(photoPlacement.img); };
  document.getElementById('resetPhotoBtn').onclick=()=>{
    photoPlacement=null; document.getElementById('photoThumb').innerHTML='📷';
    document.getElementById('recropPhotoBtn').disabled=true;
    document.getElementById('resetPhotoBtn').disabled=true; draw();
  };
  document.getElementById('downloadBtn').onclick=()=>{
    draw();
    const nm=(val('nameInput')||'poster').replace(/\s+/g,'_');
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='pmsa-group-kalotsav-'+nm+'.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    },'image/jpeg',0.92);
  };
})();
</script>
</body>
</html>
